[project]
name = "abliterated-vlm"
version = "0.1.0"
description = "Serve Huihui-Qwen3.8-27B-abliterated (GGUF) with llama.cpp as an on/off OpenAI-compatible API for OpenCode."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
vlm = "abliterated_vlm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abliterated_vlm"]
